 to fast-track a screening slot for the right VCET company this fall."},{id:"r05",person:"Victor Hale",org:"Independent angel",date:"Aug 25",where:"2:00p meeting",via:"20-year friendship",touches:17,lastW:0,src:"Dave's download \xB7 today",tags:["victor","deals","memo","angel","syndicate","anchor","hardware"],text:"In on both live deals if the memo lands this week. Wants Marta's read on contract-manufacturing risk before he anchors. Will pull two more angels if terms hold.",answer:"From Dave's download today: Victor's in on both deals if the memo lands this week, wants Marta Kowalski's read on the contract-manufacturing risk first, and will pull two more angels if terms hold."},{id:"r06",person:"Yuki Tanaka",org:"Maple Grid Energy",date:"Aug 19",where:"Series A prep",via:"portfolio",touches:21,lastW:1,src:"Meeting notes \xB7 8/19",tags:["term sheet","series a","raise","climate","energy","derek","intro"],text:"Term-sheet chatter surfaced in VTDigger. Dave still owes the intro to Derek Foss from the Aug 19 session \u2014 Derek meets Nicole tomorrow.",answer:"Yuki Tanaka \u2014 Maple Grid Energy. Term-sheet chatter hit VTDigger this morning, and Dave still owes Yuki the Derek Foss intro from Aug 19. Derek is on Nicole's calendar tomorrow at 1:30."},{id:"r07",person:"Sam Okafor",org:"Queen City Software",date:"Aug 21",where:"Friday coffee",via:"tech meetup",touches:7,lastW:0,src:"Nicole's note \xB7 8/21",tags:["engineer","ml","backend","exploring","equity","mission","hire","burlington"],text:"Senior backend/ML engineer quietly exploring startup roles \u2014 wants equity and mission over salary. Nicole promised to connect him with Kofi.",answer:"Sam Okafor \u2014 Queen City Software. Friday's coffee note: senior backend/ML engineer quietly exploring, wants equity and mission over salary. Nicole owes him the Kofi Asante connection."},{id:"r08",person:"Josephine Marsh",org:"Cedar & Sap Consumer Co.",date:"May 22",where:"Middlebury alumni event",via:"alumni network",touches
